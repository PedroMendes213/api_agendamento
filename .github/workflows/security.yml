name: DevSecOps Security Gate

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"

jobs:
  testes:
    name: Testes funcionais
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Criar configuração temporária de CI
        run: |
          python - <<'PY'
          from pathlib import Path
          import secrets

          segredo = secrets.token_urlsafe(48)

          Path(".env").write_text(
              "\n".join(
                  [
                      "DATABASE_URL=sqlite:///./agendamento.db",
                      f"JWT_SECRET_KEY={segredo}",
                      "ACCESS_TOKEN_EXPIRE_MINUTES=30",
                      "CORS_ALLOWED_ORIGINS=http://localhost:3000,http://127.0.0.1:3000",
                      "LOGIN_RATE_LIMIT_REQUESTS=5",
                      "LOGIN_RATE_LIMIT_WINDOW_SECONDS=60",
                  ]
              )
              + "\n",
              encoding="utf-8",
          )
          PY

      - name: Executar testes
        run: python -m pytest -v

  testes_seguranca:
    name: Testes interativos de segurança
    needs: testes
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Criar configuração temporária de CI
        run: |
          python - <<'PY'
          from pathlib import Path
          import secrets

          Path(".env").write_text(
              "\n".join(
                  [
                      "DATABASE_URL=sqlite:///./agendamento.db",
                      f"JWT_SECRET_KEY={secrets.token_urlsafe(48)}",
                      "ACCESS_TOKEN_EXPIRE_MINUTES=30",
                      "CORS_ALLOWED_ORIGINS=http://localhost:3000,http://127.0.0.1:3000",
                      "LOGIN_RATE_LIMIT_REQUESTS=5",
                      "LOGIN_RATE_LIMIT_WINDOW_SECONDS=60",
                  ]
              )
              + "\n",
              encoding="utf-8",
          )
          PY

      - name: Executar testes de segurança
        run: python -m pytest tests/test_exercicio12.py -v

  sast:
    name: SAST - Bandit
    needs: testes
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Instalar Bandit
        run: python -m pip install bandit

      - name: Criar pasta de relatórios
        run: mkdir -p artifacts

      - name: Analisar código-fonte
        run: |
          bandit \
            -r app \
            -f json \
            -o artifacts/bandit.json \
            --exit-zero

      - name: Executar security gate do SAST
        run: |
          python scripts/security_gate.py \
            --bandit artifacts/bandit.json

      - name: Armazenar relatório SAST
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-sast-bandit
          path: artifacts/bandit.json

  sca:
    name: SCA - Dependências
    needs: testes
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Instalar pip-audit
        run: python -m pip install pip-audit

      - name: Criar pasta de relatórios
        run: mkdir -p artifacts

      - name: Auditar dependências
        run: |
          pip-audit \
            -r requirements.txt \
            --format=json \
            --output=artifacts/pip-audit.json || true

      - name: Executar security gate das dependências
        run: |
          python scripts/security_gate.py \
            --pip-audit artifacts/pip-audit.json

      - name: Armazenar relatório SCA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-sca-pip-audit
          path: artifacts/pip-audit.json

  dast:
    name: DAST - OWASP ZAP
    needs: testes
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Criar configuração temporária de CI
        run: |
          python - <<'PY'
          from pathlib import Path
          import secrets

          Path(".env").write_text(
              "\n".join(
                  [
                      "DATABASE_URL=sqlite:///./agendamento.db",
                      f"JWT_SECRET_KEY={secrets.token_urlsafe(48)}",
                      "ACCESS_TOKEN_EXPIRE_MINUTES=30",
                      "CORS_ALLOWED_ORIGINS=http://localhost:3000,http://127.0.0.1:3000",
                      "LOGIN_RATE_LIMIT_REQUESTS=5",
                      "LOGIN_RATE_LIMIT_WINDOW_SECONDS=60",
                  ]
              )
              + "\n",
              encoding="utf-8",
          )
          PY

      - name: Criar pasta de relatórios
        run: mkdir -p artifacts

      - name: Iniciar API
        run: |
          python -m uvicorn app.main:app \
            --host 0.0.0.0 \
            --port 8000 \
            > artifacts/uvicorn.log 2>&1 &

          echo $! > artifacts/uvicorn.pid

      - name: Aguardar API
        run: |
          for tentativa in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/openapi.json > /dev/null; then
              exit 0
            fi

            sleep 1
          done

          cat artifacts/uvicorn.log
          exit 1

      - name: Executar OWASP ZAP
        run: |
          docker run \
            --rm \
            --user 0 \
            --network host \
            -v "$GITHUB_WORKSPACE/artifacts:/zap/wrk/:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
            -t http://127.0.0.1:8000 \
            -J zap-report.json \
            -r zap-report.html \
            -I || true

      - name: Executar security gate do DAST
        run: |
          python scripts/security_gate.py \
            --zap artifacts/zap-report.json

      - name: Encerrar API
        if: always()
        run: |
          if [ -f artifacts/uvicorn.pid ]; then
            kill "$(cat artifacts/uvicorn.pid)" || true
          fi

      - name: Armazenar relatórios DAST
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios-dast-zap
          path: artifacts

  security_gate:
    name: Security Gate Final
    if: always()
    needs:
      - testes
      - testes_seguranca
      - sast
      - sca
      - dast
    runs-on: ubuntu-latest

    steps:
      - name: Validar resultado de segurança
        run: |
          echo "Resultado dos testes: ${{ needs.testes.result }}"
          echo "Testes de segurança: ${{ needs.testes_seguranca.result }}"
          echo "SAST: ${{ needs.sast.result }}"
          echo "SCA: ${{ needs.sca.result }}"
          echo "DAST: ${{ needs.dast.result }}"

          if [[ "${{ needs.testes.result }}" != "success" ||
                "${{ needs.testes_seguranca.result }}" != "success" ||
                "${{ needs.sast.result }}" != "success" ||
                "${{ needs.sca.result }}" != "success" ||
                "${{ needs.dast.result }}" != "success" ]]; then
            echo "SECURITY GATE: BLOQUEADO"
            exit 1
          fi

          echo "SECURITY GATE: APROVADO"